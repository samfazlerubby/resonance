# Builds an installable Resonance APK on GitHub's servers every time you
# upload changes (or when you press "Run workflow" on the Actions tab).
# The APK appears as a downloadable Release and as a build artifact.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the standard Android project files (Gradle, icons...).
      # Files already in the repo (our manifest, MainActivity.kt) are kept.
      - name: Create Android scaffolding
        run: flutter create --org com.resonance --project-name resonance --platforms android .

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Resonance.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-apk
          path: Resonance.apk

      - name: Publish as a Release (gives you a shareable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Resonance build ${{ github.run_number }}
          body: Install Resonance.apk on an Android phone (allow "Install unknown apps" when asked).
          files: Resonance.apk
